name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFTFORMAT_VERSION: 0.62.1
  SWIFTFORMAT_SHA256: 7cb1cb1fae04932047c7015441c543848e8e60e1572d808d080e0a1f1661114a
  SWIFTLINT_VERSION: 0.65.0
  SWIFTLINT_SHA256: d6cb0aa7a2f5f1ef306fc9e37bcb54dc9a26facc8f7784ac0c3dd3eccf5c6ba6

jobs:
  check:
    name: Lint and dual-platform verification
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          sudo xcode-select -s "${newest:-/Applications/Xcode.app}"
          xcodebuild -version
          swift --version

      - name: Install SwiftFormat ${{ env.SWIFTFORMAT_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          echo "$SWIFTFORMAT_SHA256  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -o -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/swiftformat"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/bin/swiftformat" --version)" = "$SWIFTFORMAT_VERSION"

      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -o -q "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/swiftlint"
          test "$("$RUNNER_TEMP/bin/swiftlint" version)" = "$SWIFTLINT_VERSION"

      - name: Lint
        run: ./scripts/lint.sh

      - name: Test macOS
        run: ./scripts/test.sh macos

      - name: Build macOS
        run: ./scripts/build.sh macos

      - name: Build iOS Simulator
        run: ./scripts/build.sh ios

      - name: Test iOS Simulator
        run: ./scripts/test.sh ios

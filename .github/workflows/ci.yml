name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFTFORMAT_VERSION: 0.62.1
  SWIFTFORMAT_SHA256: 7cb1cb1fae04932047c7015441c543848e8e60e1572d808d080e0a1f1661114a
  SWIFTLINT_VERSION: 0.65.0
  SWIFTLINT_SHA256: d6cb0aa7a2f5f1ef306fc9e37bcb54dc9a26facc8f7784ac0c3dd3eccf5c6ba6

jobs:
  check:
    name: Lint, test and build
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select the newest installed Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          sudo xcode-select -s "${newest:-/Applications/Xcode.app}"
          xcodebuild -version
          swift --version

      - name: Install pinned SwiftFormat and SwiftLint
        run: ./scripts/bootstrap.sh

      - name: Lint
        run: ./scripts/lint.sh

      - name: Test macOS
        run: ./scripts/test.sh macos

      - name: Check README platform values
        run: xcrun swift run --package-path scripts/CheckReadmeValues CheckReadmeValues "$PWD/README.md"

      - name: Build macOS
        run: ./scripts/build.sh macos

      - name: Build iOS Simulator
        run: ./scripts/build.sh ios

      - name: Test iOS Simulator
        run: ./scripts/test.sh ios
